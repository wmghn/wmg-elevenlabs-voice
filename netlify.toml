[build]
  publish   = "public"
  functions = "netlify/functions"

# Proxy ElevenLabs TTS qua Netlify Function
[[redirects]]
  from   = "/v1/text-to-speech/*"
  to     = "/.netlify/functions/tts/:splat"
  status = 200
  force  = true

# Proxy ElevenLabs Studio: studio.mjs (Functions v2) tự khai báo path /v1/studio/*
# qua config.path — không cần redirect ở đây

# SPA fallback
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
